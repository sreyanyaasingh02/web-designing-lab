
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple weather app to check current weather conditions in any city.">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="weather-container">
        <h1>Weather App</h1>
        <p class="subtitle">Check the weather in your city</p>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name">
            <button id="searchBtn">Search</button>
        </div>

        <p id="message"></p>

        <div class="weather-info" id="weatherInfo">
            <h2 id="cityName">City Name</h2>
            <div id="weatherIcon">☀️</div>
            <h3 id="temperature">--°C</h3>
            <p id="description">Weather condition</p>

            <div class="weather-details">
                <div>
                    <span>Humidity</span>
                    <p id="humidity">--%</p>
                </div>
                <div>
                    <span>Wind Speed</span>
                    <p id="wind">-- km/h</p>
                </div>
            </div>
        </div>

        <footer>
            <p>Weather App | Web Designing Lab - Experiment 5</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
